<title>WEMU Sleep Playback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: full-window app. Fixed-height Top Bar / Sleep timeline Group / Bottom Bar; Signals flexes to fill the rest.
   Horizontal positions inside Signals and the timeline are expressed as % of their container so they track the window width. */
:root {
  --white: #ffffff;
  --dark: #1d1d1d;
  --black: #000000;
  --grey-mid: #62676c;
  --grey-label: #949494;
  --grey-line: #9e9e9e;
  --grey-border: #cccccc;
  --grey-border-2: #a9a9a9;
  --grey-ground: #ebebeb;
  --accent: #49b8ed;
  --accent-15: rgba(73, 184, 237, 0.15);
  --accent-light: #daf1fc;
  --annot: #fe3b48;
  --annot-08: rgba(254, 59, 72, 0.08);
  --video: rgba(255, 28, 28, 0.75);
  --stage-wake: rgba(217, 217, 217, 0.2);
  --stage-n1: #49b8ed;
  --stage-n2: #1463db;
  --stage-n3: #0a1e47;
  --stage-rem: #bc46e0;
  --sli: #1e4dad;
  --font: "Ubuntu", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  /* Fixed heights from the Figma frame (1920 × 1019) */
  --h-top: 50px;
  --h-band: 26px;        /* white band between Top Bar and Signals (eye toggle, annotation labels) */
  --h-timeline: 82px;
  --h-bottom: 48px;
  --label-col: 68px;     /* left edge of the trace area */
  color-scheme: light;
}
/* The prototype mirrors a light-only clinical UI: colours are set explicitly so it renders the same in any viewer theme. */

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--white);
  color: var(--dark);
  font-family: var(--font);
  overflow: auto;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: none; }

.app {
  height: 100%;
  min-width: 1360px;  /* below this the bars cannot hold every control on one line; the page scrolls sideways instead */
  min-height: 740px;  /* below this the channel rows cannot shrink further without cropping; the page scrolls instead */
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--white);
}

/* ---------------- Top Bar ---------------- */
.top-bar {
  flex: 0 0 var(--h-top);
  height: var(--h-top);
  box-sizing: border-box;
  display: flex;
  align-items: center;
  padding: 0 19px;
  background: var(--white);
  border-bottom: 1px solid var(--grey-border-2);
  filter: drop-shadow(0 4px 3.5px rgba(0, 0, 0, 0.15));
  position: relative;
  z-index: 3;
  gap: 0;
}
.top-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.menu-btn { display: flex; align-items: center; justify-content: center; height: 38px; }
.menu-btn img { width: 21.81px; height: 16px; }
/* Patient infos (10368:36911): name | birth date | age on the first line, recording + AI certainty chip on the second */
.patient { display: flex; flex-direction: column; gap: 6px; }
.patient-row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.patient-name { font-weight: 700; font-size: 14px; letter-spacing: 0.35px; line-height: 14px; color: var(--dark); }
.patient-row .vsep { align-self: stretch; width: 1.5px; background: var(--accent); }
.patient-meta { display: flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: 0.07px; line-height: 14px; color: var(--dark); }
.patient-meta .sep { width: 1px; height: 14px; background: var(--grey-border); }
.patient-rec { font-weight: 500; font-size: 14px; letter-spacing: 0.35px; line-height: 14px; color: var(--black); }
.ai-chip {
  display: flex; align-items: center; height: 15px; box-sizing: border-box; padding: 4px; border: 0; border-radius: 2px;
  background: rgba(18, 193, 5, 0.22); color: #0b4516; font: inherit; font-size: 12px; font-weight: 500; letter-spacing: 0.12px; line-height: 9px;
  cursor: default; white-space: nowrap;
}

.top-right { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 25px; }
.params { display: flex; align-items: stretch; gap: 20px; flex-shrink: 0; }
.dd-group { display: flex; align-items: stretch; }
.dd {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-sizing: border-box;
  padding: 7px 10px 7px 0;
  background: var(--accent-15);
  border-bottom: 2px solid var(--accent);
}
.dd.first { padding-left: 10px; border-top-left-radius: 4px; align-items: center; gap: 15px; }
.dd.last { border-top-right-radius: 4px; }
.dd.montage { padding-left: 10px; border-radius: 4px 4px 0 0; gap: 15px; }
.dd-text { display: flex; flex-direction: column; gap: 8px; }
.dd-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1px; line-height: 7px; color: var(--grey-mid); white-space: nowrap; }
.dd-value { font-size: 14px; font-weight: 500; letter-spacing: 0.35px; line-height: 10px; color: var(--dark); white-space: nowrap; }
.dd-tail { display: flex; align-items: flex-end; align-self: stretch; }
.dd-tail .arrow { align-self: center; width: 14px; height: 7px; margin: 0 -1px; }
.dd-tail .vsep { width: 1px; height: 25px; background: var(--accent); margin-left: 15px; }
.dd.montage .dd-tail .vsep { margin: 0 15px; }
.dd-tail .edit { width: 20px; height: 20px; align-self: center; }

.switch-item { display: flex; align-items: center; gap: 10px; padding: 15px 10px; flex-shrink: 0; }
.switch-item .lbl { font-size: 14px; font-weight: 500; letter-spacing: 0.35px; line-height: 18px; color: var(--black); white-space: nowrap; }
.switch { position: relative; width: 43px; height: 14px; flex-shrink: 0; }
.switch img { position: absolute; width: 48px; height: 30px; top: -7px; }
.switch.off img { left: -5px; }
.switch.on img { left: 0; }
.top-end { display: flex; align-items: center; justify-content: center; height: 38px; padding-left: 10px; flex-shrink: 0; }
.top-end img { width: 21.81px; height: 16px; }

/* ---------------- Middle: band + Signals ---------------- */
.middle {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}
.band { flex: 0 0 var(--h-band); position: relative; }

.eye-toggle { position: absolute; left: 21px; top: -5px; width: 36px; height: 31px; z-index: 4; }
.eye-toggle .eye { position: absolute; left: -0.75px; top: 16.28px; width: 25.09px; height: 14.6px; }
.eye-toggle .badge {
  position: absolute; left: 12.41px; top: 0;
  min-width: 7px; height: 22px; box-sizing: border-box; padding: 0 8px;
  border-radius: 100px; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; letter-spacing: 0.12px; color: var(--grey-mid); line-height: 1;
}

.signals {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.grid {
  position: absolute;
  left: 67px; right: 0; top: 0; bottom: 0;
  width: calc(100% - 67px); height: 100%;
}
.deriv-list {
  position: absolute; left: 0; top: 0; bottom: 0; width: 68px;
  box-sizing: border-box; border: 1px solid var(--grey-border-2); background: var(--white);
}
.channels {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  margin: 6.57px 0 0 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
/* Groups take their content height, then share the spare height; rows shrink (down to the 20px label) when space is short */
.deriv-group { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; }
.deriv-group.g3 { max-height: 55px; }
.ch { display: flex; align-items: center; gap: 9px; width: 100%; flex: 0 1 auto; min-height: 20px; }
.ch.g10 { gap: 10px; }
.ch-label {
  flex: 0 0 auto;
  box-sizing: border-box;
  height: 20px;
  padding: 2px 4px;
  display: flex; align-items: center; justify-content: flex-end;
  background: var(--white);
  border-radius: 2px;
  font-size: 14px; font-weight: 500; letter-spacing: 0.35px; line-height: 18px;
  color: var(--black);
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.ch-label-col { width: 55px; flex: 0 0 55px; display: flex; justify-content: flex-end; }
.trace { flex: 1 1 0; min-width: 0; height: 100%; position: relative; }
.trace img { position: absolute; left: 0; width: 100%; height: 100%; top: 0; }
.trace.flip img { transform: scaleY(-1); }
.dash { flex: none; width: 55px; box-sizing: border-box; padding: 0 4px; display: flex; justify-content: flex-end; align-items: center; background: var(--white); border-radius: 2px; font-size: 14px; font-weight: 500; line-height: 18px; color: var(--black); overflow: visible; position: relative; z-index: 1; }
.dash.h15 { height: 15px; }
.dash.h5 { height: 5px; }
.ecg-row { display: flex; align-items: center; gap: 10px; width: 100%; flex: 0 1 50px; height: 50px; min-height: 40px; }
.ecg-row .ch-label-col { width: 55px; }
.ecg-trace { flex: 1 1 0; min-width: 0; height: 100%; position: relative; overflow: visible; }
.ecg-trace img { position: absolute; left: 0; top: 0; height: 100%; width: calc(100% * 2217.34 / 1851); }

.seconds {
  position: relative; flex: 0 0 20px; margin: 0 0 0 calc(var(--label-col) - 1px); padding-left: 1px;
  background: var(--white); border: 1px solid var(--grey-border-2); box-sizing: border-box; z-index: 1;
}
.seconds span {
  position: absolute; top: 0; bottom: 0; width: 55.39px; display: flex; align-items: center;
  font-size: 10px; font-weight: 500; letter-spacing: 0.18px; line-height: 1; color: var(--black);
  text-box: trim-both cap alphabetic;  /* centre the digits themselves, as Figma's cap-height trim does */
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* Overlays positioned against the trace area */
.overlay { position: absolute; left: var(--label-col); right: 0; top: 0; bottom: 0; pointer-events: none; }
.annot-label {
  position: absolute; top: calc(var(--h-band) - 21px); left: 21.25%; width: 70px;
  height: 21.24px; display: flex; flex-direction: column; z-index: 2;
}
.annot-label span {
  flex: 1; display: flex; align-items: center; justify-content: center; align-self: flex-start;
  padding: 3px 4px; background: var(--annot); border-radius: 2px 2px 0 0;
  font-size: 14px; letter-spacing: 0.14px; line-height: 13px; color: var(--white); white-space: nowrap;
}
.annot-area { position: absolute; left: 21.274%; width: 10.637%; top: calc(var(--h-band) - 0.07px); bottom: 20px; background: var(--annot-08); }

.video-marker {
  position: absolute; top: calc(var(--h-band) + 1px); bottom: -2px;
  left: 56.18%; width: 27px; margin-left: -13.5px;
  display: flex; flex-direction: column; align-items: center; z-index: 2;
}
.video-marker .line { flex: 1 1 auto; min-height: 0; width: 1px; height: auto; }
.video-marker .cam {
  flex: 0 0 27px; width: 27px; box-sizing: border-box; padding: 2px; border-radius: 2px;
  background: var(--video); display: flex; align-items: center; justify-content: center;
}
.video-marker .cam img { width: 18.5px; height: 12.89px; }

/* ---------------- Sleep timeline Group ---------------- */
.sleep-timeline {
  flex: 0 0 var(--h-timeline);
  height: var(--h-timeline);
  margin: 5px 1px 3px;
  position: relative;
}
.hypno-full {
  position: absolute; left: 0; right: 0; top: 0; height: 21px;
  box-sizing: border-box; border: 2px solid var(--accent); border-radius: 4px; padding: 2px;
  display: flex; background: rgba(73, 184, 237, 0.2);
}
.hypno-full .s-wake { background: var(--white); }
.hypno-full i { cursor: default; }
.hypno-connector { position: absolute; top: 20px; height: 16px; width: 2px; margin-left: -1px; background: var(--accent); }
.night-stamp {
  position: absolute; top: 21px; height: 13px; box-sizing: border-box; padding-top: 2px;
  display: flex; align-items: flex-end;
}
.night-stamp.start { left: 4px; border-left: 2px solid var(--accent); padding-left: 4px; }
.night-stamp.end { right: 4px; border-right: 2px solid var(--accent); padding-right: 4px; }
.night-stamp > span {
  display: flex; gap: 6px; padding: 2px; border-radius: 2px; background: var(--white);
  border: 0.5px solid rgba(73, 184, 237, 0.3);
  font-size: 10px; font-weight: 500; letter-spacing: 0.15px; line-height: 7px; color: var(--grey-mid); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* Closed: only the overview row remains, directly under the Signals (the Signals take the freed height) */
.sleep-timeline:not(.is-open) { flex-basis: 48px; height: 48px; margin-top: 0; }
.sleep-timeline:not(.is-open) .overview { top: 0; }
.sleep-timeline:not(.is-open) .hypno-full,
.sleep-timeline:not(.is-open) .hypno-connector,
.sleep-timeline:not(.is-open) .night-stamp,
.sleep-timeline:not(.is-open) .night-outline { display: none; }
.hypno { display: flex; height: 100%; width: 100%; }
.hypno i { display: block; height: 100%; flex: none; }
.s-wake { background: var(--stage-wake); }
.s-n1 { background: var(--stage-n1); }
.s-n2 { background: var(--stage-n2); }
.s-n3 { background: var(--stage-n3); }
.s-rem { background: var(--stage-rem); }

.overview { position: absolute; left: 0; right: 0; top: 34px; height: 48px; }
.ground {
  position: absolute; left: 0; right: 0; top: 1.17px; height: 33.95px;
  box-sizing: border-box; border: 1px solid var(--grey-line); border-radius: 2px;
  background-color: var(--grey-ground);
  background-image:
    radial-gradient(circle at 0.5px 0.5px, rgba(148, 148, 148, 0.4) 0.5px, transparent 0.6px),
    radial-gradient(circle at 0.5px 0.5px, rgba(148, 148, 148, 0.4) 0.5px, transparent 0.6px);
  background-size: 3px 6px, 3px 6px;
  background-position: 0 2.5px, 1.5px 5.5px;
}
.time-tip {
  position: absolute; bottom: calc(100% - 1.17px + 2px); z-index: 6; pointer-events: none; transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 6px; padding: 4px; border-radius: 2px;
  background: var(--grey-mid); color: var(--white);
  font-size: 12px; font-weight: 500; letter-spacing: 0.18px; line-height: 9px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.time-tip[hidden] { display: none; }
.days-box {
  position: absolute; top: 1.17px; height: 33.95px; box-sizing: border-box;
  left: 4.037%; width: 93.017%;
  background: var(--white); border: 1px solid var(--grey-line);
}
.hypno-condensed { position: absolute; top: 4px; height: 10px; cursor: pointer; z-index: 1; }
.hypno-condensed:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.sleep-timeline.is-open .hypno-condensed:not(.is-active) { opacity: 0.3; }
.night-outline[hidden] { display: none; }
.night-outline {
  position: absolute; top: 1px; height: 16px; box-sizing: border-box; pointer-events: none;
  border: 2px solid var(--accent); border-radius: 2px;
  background: linear-gradient(rgba(73, 184, 237, 0.1), rgba(73, 184, 237, 0.1)), linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2));
}

/* Sleep stage tooltip (Sleep stage data + layout, 10385:1031) */
.stage-tip {
  position: absolute; bottom: calc(100% + 1px); z-index: 10; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transform: translateX(-50%);
}
.stage-tip[hidden] { display: none; }
.stage-tip .tip-body { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.stage-tip .tip-chips { display: flex; gap: 2px; }
.stage-tip .chip {
  box-sizing: border-box; padding: 4px; border-radius: 2px; border: 0.5px solid var(--tip-fill);
  background: var(--tip-fill); color: var(--tip-chip-text);
  font-size: 12px; font-weight: 500; letter-spacing: 0.18px; line-height: 8px; white-space: nowrap;
}
.stage-tip .tip-time {
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 2px;
  border: 1px solid var(--tip-border);
  background: linear-gradient(var(--tip-tint), var(--tip-tint)), var(--white);
  color: var(--tip-text); font-size: 12px; font-weight: 500; letter-spacing: 0.3px; line-height: 8px; white-space: pre;
}
.stage-tip .tip-time img { width: 10px; height: 6px; }
.stage-tip .tip-dot { width: 2px; height: 2px; }
.stage-tip.st-wake { --tip-fill: #e8e8e8; --tip-chip-text: #373b3f; --tip-border: rgba(55, 59, 63, 0.3);   --tip-tint: rgba(55, 59, 63, 0.05);   --tip-text: #373b3f; }
.stage-tip.st-n1   { --tip-fill: #49b8ed; --tip-chip-text: #ffffff; --tip-border: rgba(73, 184, 237, 0.6);  --tip-tint: rgba(73, 184, 237, 0.05);  --tip-text: #1c4659; }
.stage-tip.st-n2   { --tip-fill: #1463db; --tip-chip-text: #ffffff; --tip-border: rgba(20, 99, 219, 0.55); --tip-tint: rgba(20, 99, 219, 0.05);  --tip-text: #0f3061; }
.stage-tip.st-n3   { --tip-fill: #0a1e47; --tip-chip-text: #ffffff; --tip-border: rgba(10, 30, 71, 0.3);    --tip-tint: rgba(10, 30, 71, 0.05);    --tip-text: #0a1e47; }
.stage-tip.st-rem  { --tip-fill: #bc46e0; --tip-chip-text: #ffffff; --tip-border: rgba(188, 70, 224, 0.55); --tip-tint: rgba(188, 70, 224, 0.05);  --tip-text: #3b0f48; }
.events { position: absolute; top: 19px; height: 14.38px; }
.events img { position: absolute; top: 0; height: 100%; }
.events .sli { position: absolute; top: 0; width: 2px; height: 100%; background: var(--white); }
/* Sleep off (Bottom Bar toggle): no hypnograms; the annotation ticks grow upward to fill the row (bottom edge unchanged) */
.sleep-timeline.sleep-off .hypno-condensed,
.sleep-timeline.sleep-off .night-outline { display: none; }
.sleep-timeline.sleep-off .events { top: 3.71px; height: 29.67px; }
.sleep-toggle { cursor: pointer; border-radius: 4px; }
.sleep-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.events .sli.blue { background: var(--sli); }
.active-window {
  position: absolute; top: 0; height: 36.27px; width: 7.99px; box-sizing: border-box;
  border: 1px solid var(--accent); border-radius: 2px;
  background: linear-gradient(rgba(73, 184, 237, 0.1), rgba(73, 184, 237, 0.1)), linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2));
}
.day {
  position: absolute; box-sizing: border-box; display: flex; align-items: flex-end;
  padding: 4px 0 0 4px; border-left: 1px solid var(--grey-line);
}
.day.end { border-left: 0; border-right: 1px solid var(--grey-line); padding: 4px 4px 0 0; }
.day span { display: flex; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.18px; line-height: 8px; color: var(--grey-label); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------------- Bottom Bar ---------------- */
.bottom-bar {
  flex: 0 0 var(--h-bottom);
  height: var(--h-bottom);
  box-sizing: border-box;
  padding: 4px 19px 4px 10px;
  background: var(--white);
  border-top: 1px solid var(--grey-border-2);
  filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.15));
  display: grid;
  grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr);
  column-gap: 24px;
  align-items: center;
  position: relative;
  z-index: 3;
}
.bb-left { display: flex; align-items: center; gap: 20px; justify-self: start; }
.bb-left .slot { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }

/* Sleep synthesis button (Secondary/Button/Rectangle/Active, 10389:12363) */
/* Styleguide (10389:12693): Default = white, no halo · Hover = 2px light-blue halo, no fill · Active (panel open) = halo + blue fill, white content */
.synth-btn {
  display: flex; padding: 0; border: 2px solid transparent; border-radius: 7px;
  background: none; font: inherit; cursor: pointer;
}
.synth-btn > span {
  display: flex; align-items: center; gap: 6px; height: 24px; padding: 3px 6px 3px 7px;
  background: var(--white); border: 1px solid var(--accent); border-radius: 7px;
  box-shadow: 0 2px 4px rgba(110, 139, 200, 0.1);
  font-size: 14px; font-weight: 500; letter-spacing: 0.105px; color: #1b1d3a; white-space: nowrap;
}
.synth-btn[hidden] { display: none; }
.synth-btn .ico-active { display: none; }
.synth-btn:hover, .synth-btn[aria-expanded="true"] { border-color: rgba(73, 184, 237, 0.15); }
.synth-btn:hover > span { background: transparent; box-shadow: 0 2px 8px rgba(110, 139, 200, 0.1); }
.synth-btn[aria-expanded="true"] > span { background: rgba(73, 184, 237, 0.85); color: var(--white); box-shadow: 0 2px 8px rgba(110, 139, 200, 0.1); }
.synth-btn[aria-expanded="true"] .ico-default { display: none; }
.synth-btn[aria-expanded="true"] .ico-active { display: block; }
.synth-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sleep Synthesis - full panel (10389:12375): floats above the button, over Signals + timeline */
.synth-panel {
  position: absolute; left: 122px; bottom: calc(var(--h-bottom) + 4px); z-index: 20;
  width: 444px; max-width: calc(100% - 138px); max-height: calc(100% - var(--h-top) - var(--h-bottom) - 16px);
  display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--white); border: 1px solid #c9eafa; border-radius: 2px; box-shadow: 0 2px 7px 1px rgba(0, 0, 0, 0.14);
  color: #1b1d3a; font-weight: 500;
}
.synth-panel[hidden] { display: none; }

  var NIGHT_3 = parseNight('Éveil;07 min;1,58;00:04;00:11|N1;03 min;0,68;00:11;00:14|N2;11 min;2,48;00:14;00:25|N3;35 min;7,88;00:25;01:00|N2;08 min;1,80;01:00;01:08|REM;07 min;1,58;01:08;01:15|Éveil;02 min;0,45;01:15;01:17|N1;02 min;0,45;01:17;01:19|N2;19 min;4,28;01:19;01:38|N3;31 min;6,98;01:38;02:09|N2;11 min;2,48;02:09;02:20|REM;15 min;3,38;02:20;02:35|Éveil;03 min;0,68;02:35;02:38|N1;03 min;0,68;02:38;02:41|N2;30 min;6,76;02:41;03:11|N3;19 min;4,28;03:11;03:30|N2;08 min;1,80;03:30;03:38|REM;19 min;4,28;03:38;03:57|Éveil;03 min;0,68;03:57;04:00|N1;03 min;0,68;04:00;04:03|N2;49 min;11,04;04:03;04:52|N3;08 min;1,80;04:52;05:00|N2;08 min;1,80;05:00;05:08|REM;21 min;4,73;05:08;05:29|Éveil;04 min;0,90;05:29;05:33|N1;02 min;0,45;05:33;05:35|N2;52 min;11,71;05:35;06:27|REM;24 min;5,41;06:27;06:51|N1;02 min;0,45;06:51;06:53|N2;30 min;6,76;06:53;07:23|Éveil;05 min;1,13;07:23;07:28', '02/01/2026', '03/01/2026');
  var NIGHTS = [NIGHT_1, NIGHT, NIGHT_3];

  var STAGE = { 'Éveil': 'wake', 'N1': 'n1', 'N2': 'n2', 'N3': 'n3', 'REM': 'rem' };
  function pctNum(e) { return parseFloat(e[2].replace(',', '.')); }
  // unit = share of the container (in %) taken by 1 % of the night
  function segs(list, unit) {
    return list.map(function (e, i) {
      return '<i class="s-' + STAGE[e[0]] + '" data-i="' + i + '" style="width:' + (pctNum(e) * unit).toFixed(4) + '%"></i>';
    }).join('');
  }

  // ---- Overview timeline: x positions from the 1918px-wide Figma group, converted to % ----
  var W = 1918, X0 = 1;
  function pct(x) { return ((x - X0) / W * 100).toFixed(4) + '%'; }
  var ov = document.getElementById('overview');
  var out = '';
  // Condensed hypnograms: [x, frame width]; stages fill the frame
  var CONDENSED = [[120, 248], [716, 237], [1349, 248]];
  function totalPct(list) { return list.reduce(function (s, e) { return s + pctNum(e); }, 0); }
  CONDENSED.forEach(function (h, n) {
    var list = NIGHTS[n];
    out += '<div class="night-outline" data-night="' + n + '" style="left:' + pct(h[0] + 0.54) + ';width:' + ((h[1] + 2) / W * 100).toFixed(4) + '%"></div>';
    out += '<div class="hypno-condensed hypno" data-night="' + n + '" role="button" tabindex="0" aria-pressed="false"' +
           ' aria-label="Night ' + (n + 1) + ', ' + list[0][3] + ' to ' + list[list.length - 1][4] + '"' +
           ' style="left:' + pct(h[0]) + ';width:' + (h[1] / W * 100).toFixed(4) + '%">' + segs(list, 100 / totalPct(list)) + '</div>';
  });
  // Event markers (Frame 5787, starts at x=394.745): [offset px, asset, svg width]
  var ex = 394.745;
  var ev = '';
  [[0,'hpn-0',2],[20,'hpn-0',2],[40,'hpn-1',32],[90,'hpn-2',2],[110,'hpn-3',12],[140,'hpn-4',12],
   [170,'hpn-0',2],[190,'hpn-0',2],[210,'hpn-0',2],[230,'hpn-0',2],[250,'hpn-5',52],[320,'hpn-0',2]].forEach(function (e) {
    ev += '<img src="assets/' + e[1] + '.svg" alt="" style="left:calc(' + pct(ex + e[0]) + ' - 1px);width:' + e[2] + 'px">';
  });
  [325,332,339,346,353,360,367].forEach(function (o) { ev += '<span class="sli" style="left:' + pct(ex + o) + '"></span>'; });
  [374, 451].forEach(function (o) { ev += '<span class="sli blue" style="left:' + pct(ex + o) + '"></span>'; });
  out += '<div class="events" style="left:0;right:0">' + ev + '</div>';
  // ---- Time scale of the overview, taken from the hypnograms ----
  // Each condensed hypnogram's left/right edge is pinned to its night's first start / last end time; between and
  // beyond them time runs linearly. Midnight markers and the hover tooltip both use this scale, so they agree.
  function stampMs(st) { return Date.UTC(+st.slice(6, 10), +st.slice(3, 5) - 1, +st.slice(0, 2), +st.slice(11, 13), +st.slice(14, 16)); }
  var ANCHORS = [];
  CONDENSED.forEach(function (h, n) {
    var l = NIGHTS[n];
    ANCHORS.push([h[0], stampMs(l[0][3])], [h[0] + h[1], stampMs(l[l.length - 1][4])]);
  });
  function interp(v, from, to) {  // piecewise-linear through ANCHORS, extrapolating with the first/last segment
    var i = 0;
    while (i < ANCHORS.length - 2 && v > ANCHORS[i + 1][from]) i++;
    var a = ANCHORS[i], b = ANCHORS[i + 1];
    return a[to] + (v - a[from]) * (b[to] - a[to]) / (b[from] - a[from]);
  }
  function figmaXToTime(x) { return interp(x, 0, 1); }
  function timeToFigmaX(t) { return interp(t, 1, 0); }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(t) { return two(t.getUTCDate()) + '/' + two(t.getUTCMonth() + 1) + '/' + t.getUTCFullYear(); }
  function fmtHour(t) { return two(t.getUTCHours()) + ':' + two(t.getUTCMinutes()); }
  var BOX_L = 78.43, BOX_R = 1863;
  // Midnight markers inside the 3-day box: [day, top, height]; all markers (incl. the end one) share top 1.17 / bottom 48
  [[1, 1.17, 46.83], [2, 1.17, 46.83], [3, 1.17, 46.83]].forEach(function (d) {
    var t = Date.UTC(2026, 0, d[0]), x = timeToFigmaX(t);
    if (x < BOX_L || x > BOX_R) return;
    out += '<div class="day" style="left:' + pct(x) + ';top:' + d[1] + 'px;height:' + d[2] + 'px"><span><span>' + fmtDate(new Date(t)) + '</span><span>00:00</span></span></div>';
  });
  // Right edge of the box: the time it actually stands for on this scale
  var tEnd = new Date(Math.round(figmaXToTime(BOX_R) / 60000) * 60000);
  out += '<div class="day end" style="right:' + ((W + X0 - BOX_R) / W * 100).toFixed(4) + '%;top:1.17px;height:46.83px"><span><span>' + fmtDate(tEnd) + '</span><span>' + fmtHour(tEnd) + '</span></span></div>';
  out += '<div class="active-window" style="left:' + pct(500.479) + '"></div>';
  ov.insertAdjacentHTML('beforeend', out);

  // ---- Sleep timeline behaviour ----
  var tl = document.getElementById('sleep-timeline');
  var full = document.getElementById('hypno-full');
  var connector = document.getElementById('hypno-connector');
  var tip = document.getElementById('stage-tip');
  var active = -1;

  // Vertical connector from the fully displayed hypnogram down to the centre of the active night's outline
  function drawVectors() {
    if (active < 0) return;
    var box = tl.getBoundingClientRect();
    var o = ov.querySelector('.night-outline[data-night="' + active + '"]').getBoundingClientRect();
    connector.style.left = (o.left + o.width / 2 - box.left) + 'px';
  }
  function stampHtml(stamp) { return '<span>' + stamp.slice(0, 10) + '</span><span>' + stamp.slice(11) + '</span>'; }

  function setNight(n) {
    active = (n === active) ? -1 : n;
    tl.classList.toggle('is-open', active >= 0);
    ov.querySelectorAll('.hypno-condensed').forEach(function (el) {
      var on = +el.dataset.night === active;
      el.classList.toggle('is-active', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    ov.querySelectorAll('.night-outline').forEach(function (el) { el.hidden = +el.dataset.night !== active; });
    tip.hidden = true;
    if (active >= 0) {
      var list = NIGHTS[active];
      var total = list.reduce(function (s, e) { return s + pctNum(e); }, 0);
      full.innerHTML = segs(list, 100 / total);
      document.getElementById('stamp-start').innerHTML = stampHtml(list[0][3]);
      document.getElementById('stamp-end').innerHTML = stampHtml(list[list.length - 1][4]);
      drawVectors();
    }
  }

  ov.addEventListener('click', function (e) {
    var h = e.target.closest('.hypno-condensed');
    if (h) setNight(+h.dataset.night);
  });
  ov.addEventListener('keydown', function (e) {
    var h = e.target.closest('.hypno-condensed');
    if (h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setNight(+h.dataset.night); }
  });
  window.addEventListener('resize', drawVectors);

  // Sleep toggle (Bottom Bar): off hides everything hypnogram-related in the timeline
  var sleepToggle = document.getElementById('sleep-toggle'), sleepSwitch = document.getElementById('sleep-switch');
  function toggleSleep() {
    var on = sleepToggle.getAttribute('aria-checked') !== 'true';
    sleepToggle.setAttribute('aria-checked', on ? 'true' : 'false');
    sleepSwitch.className = 'switch ' + (on ? 'on' : 'off');
    sleepSwitch.firstChild.src = on ? 'assets/switch-on-mat.svg' : 'assets/switch-off.svg';
    if (!on && active >= 0) setNight(active);  // close the open night
    tl.classList.toggle('sleep-off', !on);
    // Sleep synthesis is only available while the Hypnogram toggle is on
    synthBtn.hidden = !on;
    if (!on) setSynth(false);
  }

  // ---- Sleep synthesis panel (values from "Sleep Synthesis - full", 10389:12375) ----
  var NAPS = [['sièste 1','01/01/2026','20:34','21:10','36min'],['sièste 2','02/01/2026','08:25','08:54','29min'],
              ['sièste 3','02/01/2026','12:06','14:01','1h 55min'],['sièste 4','02/01/2026','15:14','16:28','1h 14min']];
  // Jour n summarises hypnogram n (NIGHTS[n-1]); naps are not in the hypnogram data and keep the Figma values.
  var SYNTH_DAYS = [
    { n: 1, from: '31/12/2025 10:18', to: '01/01/2026 10:18', naps: [] },
    { n: 2, from: '01/01/2026 10:18', to: '02/01/2026 10:18', naps: NAPS },
    { n: 3, from: '02/01/2026 10:18', to: '03/01/2026 10:18', naps: [] }
  ];
  function durMin(t) { var h = /(\d+)h/.exec(t), m = /(\d+)\s*min/.exec(t); return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0); }
  function fmtDur(m) { return m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'min' : '') : m + 'min'; }
  function nightSummary(list) {
    var sleepIdx = list.map(function (e, i) { return e[0] !== 'Éveil' ? i : -1; }).filter(function (i) { return i >= 0; });
    var first = sleepIdx[0], last = sleepIdx[sleepIdx.length - 1];
    var sleepMin = 0, awakenings = 0, perStage = {}, perPct = {}, totalPct = 0;
    list.forEach(function (e, i) {
      var m = durMin(e[1]), pc = pctNum(e);
      perStage[e[0]] = (perStage[e[0]] || 0) + m;
      perPct[e[0]] = (perPct[e[0]] || 0) + pc;
      totalPct += pc;
      if (e[0] !== 'Éveil') sleepMin += m;
      else if (i > first && i < last) awakenings++;  // wake episodes between sleep onset and final awakening
    });
    return {
      rows: [['Temps de sommeil', fmtDur(sleepMin)], ['Heure d’endormissement', list[first][3].slice(11)],
             ['Heure de réveil', list[last][4].slice(11)], ['Nombre de réveil', String(awakenings)]],
      stages: [['éveil', 'Éveil'], ['REM', 'REM'], ['N1', 'N1'], ['N2', 'N2'], ['N3', 'N3']].map(function (k) {
        return [k[0], fmtDur(perStage[k[1]] || 0), Math.round((perPct[k[1]] || 0) / totalPct * 100) + '%'];
      })
    };
  }
  function joinRule(parts) { return parts.join('<div class="synth-rule"></div>'); }
  document.getElementById('synth-body').innerHTML = SYNTH_DAYS.map(function (d) {
    var sum = nightSummary(NIGHTS[d.n - 1]), NIGHT_ROWS = sum.rows, STAGE_ROWS = sum.stages;
    var night = '<div class="synth-col">' + joinRule(NIGHT_ROWS.map(function (r) {
      return '<div class="synth-row"><span class="synth-lbl">' + r[0] + '</span><span class="synth-val">' + r[1] + '</span></div>';
    })) + '</div><div class="synth-sep"></div><div class="synth-col">' +
      '<div class="synth-stage-head"><span class="synth-lbl">stades</span><span class="synth-lbl">Temps</span><span class="synth-lbl">%</span></div>' +
      '<div class="synth-rule"></div><div class="synth-stages">' + STAGE_ROWS.map(function (r) {
        return '<div class="synth-stage"><b>' + r[0] + '</b><span class="synth-val t">' + r[1] + '</span><span class="synth-val pc">' + r[2] + '</span></div>';
      }).join('') + '</div></div>';
    var naps = d.naps.length ? '<div class="synth-col">' + joinRule(d.naps.map(function (r) {
      return '<div class="synth-nap"><span class="who"><span class="synth-lbl">' + r[0] + '</span><span class="synth-val">' + r[1] + '</span></span>' +
        '<span class="span"><span class="synth-val">' + r[2] + '</span><img src="assets/synth-arrow.svg" alt="to"><span class="synth-val">' + r[3] + '</span></span>' +
        '<span class="synth-val">' + r[4] + '</span></div>';
    })) + '</div>' : '<div class="synth-row"><span class="synth-lbl">sièste</span><span class="synth-val">Aucune</span></div>';
    // One column per day: title, then "Sommeil nocturne" card, then "Siestes" card
    return '<div class="synth-day"><div class="synth-day-title"><b>Jour ' + d.n + '</b><span class="mute">du</span><span>' + d.from +
      '</span><span class="mute">au</span><span>' + d.to + '</span></div><div class="synth-day-body">' +
      '<div class="synth-section"><h3>Sommeil nocturne</h3><div class="synth-card night">' + night + '</div></div>' +
      '<div class="synth-section"><h3>Siestes</h3><div class="synth-card naps">' + naps + '</div></div></div></div>';
  }).join('');

  var synthBtn = document.getElementById('synth-btn'), synthPanel = document.getElementById('synth-panel');
  function setSynth(open) {
    synthPanel.hidden = !open;
    synthBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  synthBtn.addEventListener('click', function () { setSynth(synthPanel.hidden); });
  document.getElementById('synth-close').addEventListener('click', function () { setSynth(false); synthBtn.focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !synthPanel.hidden) { setSynth(false); synthBtn.focus(); } });
  sleepToggle.addEventListener('click', toggleSleep);
  sleepToggle.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSleep(); }
  });

  // Stage tooltip, centred above the hovered stage — on the fully displayed hypnogram and on the condensed ones
  function showTip(seg, list) {
    var d = list[+seg.dataset.i];
    var key = STAGE[d[0]];
    tip.className = 'stage-tip st-' + key;
    document.getElementById('tip-stage').textContent = d[0].toUpperCase();
    document.getElementById('tip-dur').textContent = d[1];
    document.getElementById('tip-start').textContent = d[3];
    document.getElementById('tip-end').textContent = d[4].replace(' ', '  ');
    document.getElementById('tip-arrow').src = 'assets/tip-arrow-' + key + '.svg';
    document.getElementById('tip-dot').src = 'assets/tip-dot-' + key + '.svg';
    var box = tl.getBoundingClientRect(), r = seg.getBoundingClientRect();
    tip.hidden = false;
    tip.style.bottom = (box.bottom - r.top + 1) + 'px';  // sits just above the hovered bar
    // keep the tooltip on screen near the edges; the dot stays on the stage's centre
    var cx = r.left + r.width / 2 - box.left, half = tip.offsetWidth / 2;
    var x = Math.min(Math.max(cx, half - box.left + 4), box.width - half - 4 + (window.innerWidth - box.right));
    tip.style.left = x + 'px';
    tip.querySelector('.tip-dot').style.transform = 'translateX(' + (cx - x) + 'px)';
  }
  full.addEventListener('mouseover', function (e) {
    var seg = e.target.closest('i');
    if (seg && active >= 0) showTip(seg, NIGHTS[active]);
  });
  full.addEventListener('mouseleave', function () { tip.hidden = true; });
  ov.addEventListener('mouseover', function (e) {
    var seg = e.target.closest('.hypno-condensed i');
    if (seg) showTip(seg, NIGHTS[+seg.parentNode.dataset.night]);
    else tip.hidden = true;
  });
  ov.addEventListener('mouseleave', function () { tip.hidden = true; timeTip.hidden = true; });

  // Timeline hover tooltip (10396:21919): date and time under the cursor while it moves over the 3-day timeline segment.
  // Uses the hypnogram-based time scale defined with the overview (figmaXToTime).
  var timeTip = document.getElementById('time-tip'), daysBox = document.getElementById('days-box');
  ov.addEventListener('mousemove', function (e) {
    var b = daysBox.getBoundingClientRect(), o = ov.getBoundingClientRect();
    // hidden outside the box, and while a sleep stage tooltip is showing (both sit above the timeline)
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom || e.target.closest('.hypno-condensed i')) { timeTip.hidden = true; return; }
    var t = new Date(Math.round(figmaXToTime(X0 + (e.clientX - o.left) / o.width * W) / 60000) * 60000);  // nearest minute
    document.getElementById('time-tip-date').textContent = two(t.getUTCDate()) + '/' + two(t.getUTCMonth() + 1) + '/' + t.getUTCFullYear();
    document.getElementById('time-tip-hour').textContent = two(t.getUTCHours()) + ':' + two(t.getUTCMinutes());
    timeTip.hidden = false;
    var half = timeTip.offsetWidth / 2, x = e.clientX - o.left;
    timeTip.style.left = Math.min(Math.max(x, b.left - o.left + half), b.right - o.left - half) + 'px';
  });
})();
</script>
