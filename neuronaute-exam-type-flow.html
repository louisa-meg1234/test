<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuronaute app - exam type flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Figma page "[DRAFT] [TAB] Exam type" (10621:64876). Flow shown inside the tablet mockup 10658:64512 (1023 × 663,
   screen area at (28,25) 970×623):
   1. BIOSerenity Connect – Enregistrement (image) — "Lancer le neuronaute" 10686:31334
   2. [Record Config] Exam type selection 10621:66414 — exam type dropdown (choices 10697:46766), "Save & continue"
   3. [Record Summary] - Before launch 10684:30781 — exam type dropdown 10684:30845, "Mode local" / "Mode en ligne"
   4. [TAB] [Monitor live] Not Recording 10671:23250 — "Start Record button" 10671:25724
   5. [TAB] [Monitor live] Recording 10671:25729
   Screens 2–5 are Figma renders with the interactive parts rebuilt on top (positions in Figma px of each screen). */
:root { --bg: #e9ebef; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: "Ubuntu", "Segoe UI", Arial, sans-serif; }
.device {
  position: relative;
  width: min(96vw, calc(96vh * 1023 / 663));
  aspect-ratio: 1023 / 663;
  container-type: inline-size;
}
.device img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
.screen {
  position: absolute; overflow: hidden; background: #fff;
  left: calc(28 / 1023 * 100%); top: calc(25 / 663 * 100%);
  width: calc(970 / 1023 * 100%); height: calc(623 / 663 * 100%);
  border-radius: calc(11 / 1023 * 100cqw);
}
.screen[hidden] { display: none; }
/* Figma image crop: top-aligned, 100.21% × 102.51%, left −0.11% */
#screen-1 .shot { left: -0.11%; top: 0; width: 100.21%; height: 102.51%; max-width: none; }
.frame { inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.launch-btn {
  /* Figma 10686:31334: #1e4dad, radius 3, padding 6 + label 4, Ubuntu Medium 14 white. */
  position: absolute;
  left: calc(329 / 1023 * 100%); top: calc(273 / 663 * 100%);
  width: calc(159 / 1023 * 100%); height: calc(28 / 663 * 100%);
  display: flex; align-items: center; justify-content: center;
  border: 0; margin: 0; padding: 0 calc(10 / 1023 * 100cqw);
  border-radius: calc(3 / 1023 * 100cqw);
  background: #1e4dad; color: #fff;
  font-family: "Ubuntu", "Segoe UI", Arial, sans-serif; font-weight: 500;
  font-size: calc(14 / 1023 * 100cqw); line-height: normal; white-space: nowrap;
  cursor: pointer; z-index: 6;
  transition: background-color .12s ease, transform .08s ease;
}
.launch-btn[hidden] { display: none; }
.launch-btn:hover { background: #173c88; }
.launch-btn:active { background: #122f6b; transform: scale(.98); }
.launch-btn:focus-visible { outline: 2px solid #49b8ed; outline-offset: 2px; }

/* Screens 2–5: the render fills the screen's width; everything on top is placed in that screen's Figma px (--u) */
.app { position: absolute; left: 0; top: 0; width: 100%; container-type: inline-size; }
.app > .shot { position: relative; width: 100%; height: auto; }
.ov { position: absolute; inset: 0; --u: calc(100cqw / var(--w)); }
.ov > * { position: absolute; }
.hot { /* invisible hit area over a button of the render */
  border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; border-radius: calc(8 * var(--u));
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--bw) * var(--u)); height: calc(var(--bh) * var(--u));
}
.hot:hover { background: rgba(255, 255, 255, 0.12); box-shadow: inset 0 0 0 100vmax rgba(30, 77, 173, 0.06); }
.hot:active { box-shadow: inset 0 0 0 100vmax rgba(30, 77, 173, 0.14); }
.hot:focus-visible { outline: 2px solid #49b8ed; outline-offset: 2px; }
.hot.round { border-radius: 50%; }

/* Exam type badge ("Status", 10697:46754 / 46752 / 46753): 24px high, padding 4×5, radius 4, Ubuntu Medium 12 white */
.badge {
  display: inline-flex; align-items: center; justify-content: center; height: calc(24 * var(--u)); padding: 0 calc(5 * var(--u));
  border-radius: calc(4 * var(--u)); color: var(--t, #fff); font-weight: 500; font-size: calc(12 * var(--u)); line-height: 1; white-space: nowrap;
  background: var(--c); border: calc(1 * var(--u)) solid var(--c);
}
/* Exam type field: config 10696:44729 (white, #e1e7f4 border, radius 8, padding 20×14) / summary 10684:30845 */
.exam {
  display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #fff; font: inherit; text-align: left;
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--bw) * var(--u)); height: calc(var(--bh) * var(--u));
}
.exam.cfg { border: 1px solid #e1e7f4; border-radius: calc(8 * var(--u)); padding: 0 calc(14 * var(--u)); box-shadow: 0 1px 2px rgba(12, 12, 13, 0.05); }
.exam.sum { border: 1px solid rgba(30, 77, 173, 0.2); border-radius: calc(8 * var(--u)); padding: 0 calc(12 * var(--u)) 0 calc(6 * var(--u)); box-shadow: 0 1px 8px 1px rgba(30, 77, 173, 0.08); }
.exam img.arrow { position: static; width: calc(11.64 * var(--u)); height: auto; transition: transform .15s ease; }
.exam[aria-expanded="true"] img.arrow { transform: rotate(180deg); }
/* No exam type on the config screen (10705:46915): shorter field with a red border, placeholder, red arrow; the warning
   "Exam type not specified." and the greyed "Save & continue" come with that frame's render, whose content sits 17px higher */
.exam.cfg.is-empty { height: calc(46 * var(--u)); border-color: rgba(228, 31, 19, 0.2); }
.exam .ph { font-size: calc(10 * var(--u)); letter-spacing: 0.6px; color: #949494; white-space: nowrap; }
.hot:disabled { cursor: not-allowed; background: transparent; box-shadow: none; }
.exam:focus-visible { outline: 2px solid #49b8ed; outline-offset: 2px; }
.menu {
  margin: 0; padding: calc(6 * var(--u)); list-style: none; z-index: 3;
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--bw) * var(--u));
  background: #fff; border: 1px solid #e1e7f4; border-radius: calc(8 * var(--u)); box-shadow: 0 4px 16px rgba(30, 77, 173, 0.12);
  display: flex; flex-direction: column; gap: calc(2 * var(--u));
}
.menu[hidden] { display: none; }
/* list (10697:46766): left-aligned badges 10px apart, padding 5, then "No Exam type" in grey 10px */
.menu .badge { height: calc(19 * var(--u)); }
.no-type { font-size: calc(10 * var(--u)); letter-spacing: 0.6px; color: #949494; white-space: nowrap; }
.exam .no-type { font-size: calc(12 * var(--u)); }
.menu li { display: flex; align-items: center; padding: calc(4 * var(--u)) calc(8 * var(--u)); border-radius: calc(6 * var(--u)); cursor: pointer; }
.menu li:hover, .menu li.is-focus { background: #f3f6fb; }
.menu li[aria-selected="true"] { background: #e8eef9; }
/* Device info popover (10621:66008), opened above the recorder's "Device info/Hover" icon 10684:30916 */
.dinfo {
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(180 * var(--u)); z-index: 3;
  display: flex; flex-direction: column; gap: calc(16 * var(--u)); padding: calc(20 * var(--u));
  background: #fff; border: 1px solid rgba(30, 77, 173, 0.15); border-radius: calc(8 * var(--u)); white-space: nowrap;
}
.dinfo[hidden] { display: none; }
.dinfo div { display: flex; flex-direction: column; gap: calc(8 * var(--u)); }
.dinfo span { text-box: trim-both cap alphabetic; }
.dinfo span:first-child { font-size: calc(10 * var(--u)); letter-spacing: 0.5px; color: #949494; line-height: normal; }
.dinfo span:last-child { font-size: calc(11 * var(--u)); letter-spacing: 0.55px; color: #000; line-height: calc(15 * var(--u)); }
/* Monitor banner: the badge + "Enregistrement 0986" are redrawn over a patch of the banner's own gradient */
.patch {
  left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u)); width: calc(var(--bw) * var(--u)); height: calc(4 * var(--u));
  background-image: var(--img); background-repeat: no-repeat;
  background-size: calc(var(--w) * var(--u)) auto; background-position: calc(var(--x) * var(--u) * -1) calc(var(--sy) * var(--u) * -1);
  transform-origin: top; transform: scaleY(var(--k));
}
.ban { display: flex; align-items: center; gap: calc(5 * var(--u)); left: calc(var(--x) * var(--u)); top: calc(55.9 * var(--u)); height: calc(24 * var(--u)); }
.ban .badge[hidden] { display: none; }
.ban .badge { border: calc(0.5 * var(--u)) solid rgba(255, 255, 255, 0.5); box-shadow: 0 1px 4px rgba(30, 77, 173, 0.08); }
.ban span:last-child { color: #fff; font-size: calc(14 * var(--u)); letter-spacing: 0.07px; white-space: nowrap; }
</style>
</head>
<body>
<div class="device">
  <!-- 1. BIOSerenity Connect – Enregistrement -->
  <div class="screen" id="screen-1">
    <img class="shot" src="assets/neuronaute/bc-enregistrement.png" alt="BIOSerenity Connect – Enregistrement">
  </div>
  <button class="launch-btn" id="launch-nn" type="button" data-node-id="10686:31334">Lancer le neuronaute</button>

  <!-- 2. Record configuration (10621:66414) -->
  <div class="screen" id="screen-2" hidden>
    <div class="app">
      <img class="shot" id="cfg-shot" src="assets/neuronaute/record-config.png" alt="Record configuration">
      <div class="ov" style="--w:960">
        <button class="hot" type="button" data-back="1" aria-label="Back" style="--x:0;--y:40;--bw:32;--bh:34"></button>
        <button class="exam cfg" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Exam type" data-node-id="10696:44729" style="--x:331;--y:117;--bw:298;--bh:64"></button>
        <ul class="menu" role="listbox" aria-label="Exam type" hidden id="cfg-menu" data-node-id="10697:46766" style="--x:331;--y:185;--bw:298"></ul>
        <button class="hot" type="button" id="cfg-save" data-go="3" aria-label="Save &amp; continue" data-node-id="10621:66596" style="--x:736;--y:552;--bw:200;--bh:36"></button>
      </div>
    </div>
  </div>

  <!-- 3. Record summary – before launch (10684:30781) -->
  <div class="screen" id="screen-3" hidden>
    <div class="app">
      <img class="shot" src="assets/neuronaute/record-summary.png" alt="Enregistrement 123456">
      <div class="ov" style="--w:960">
        <button class="hot" type="button" data-back="2" aria-label="Back" style="--x:0;--y:38;--bw:32;--bh:34"></button>
        <button class="exam sum" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Type d'examen" data-node-id="10684:30845" style="--x:287.5;--y:208.2;--bw:140;--bh:36"></button>
        <ul class="menu" role="listbox" aria-label="Type d'examen" hidden style="--x:287.5;--y:248.2;--bw:140"></ul>
        <button class="hot round" type="button" id="dinfo-btn" aria-label="Device info" aria-expanded="false" aria-controls="dinfo" data-node-id="10684:30916" style="--x:731.5;--y:303.2;--bw:18;--bh:18"></button>
        <div class="dinfo" id="dinfo" role="tooltip" hidden data-node-id="10621:66008" style="--x:650.5;--y:156">
          <div><span>Enregistreur</span><span>EU LOT XXXXXX SN XXXX</span></div>
          <div><span>Extender</span><span>EU LOT XXXXXX SN XXXX</span></div>
          <div><span>Blink</span><span>EU LOT XXXXXX SN XXXX</span></div>
        </div>
        <button class="hot" type="button" data-go="4" aria-label="Mode local" data-node-id="10684:30939" style="--x:184;--y:500;--bw:280;--bh:36"></button>
        <button class="hot" type="button" data-go="4" aria-label="Mode en ligne" data-node-id="10684:30945" style="--x:496;--y:500;--bw:280;--bh:36"></button>
      </div>
    </div>
  </div>

  <!-- 4. Monitor live – not recording (10671:23250) -->
  <div class="screen" id="screen-4" hidden>
    <div class="app">
      <img class="shot" src="assets/neuronaute/monitor-not-recording.png" alt="Monitor live – not recording">
      <div class="ov" style="--w:1001">
        <button class="hot" type="button" data-back="3" aria-label="Back" style="--x:0;--y:40;--bw:26;--bh:36"></button>
        <div class="patch" aria-hidden="true" style="--img:url(assets/neuronaute/monitor-not-recording.png);--x:28;--y:53;--bw:236;--sy:82;--k:7.5"></div>
        <div class="ban" style="--x:32.1"><span class="badge"></span><span>Enregistrement 0986</span></div>
        <button class="hot round" type="button" data-go="5" aria-label="Start record" data-node-id="10671:25724" style="--x:944.3;--y:574.9;--bw:39.7;--bh:39.7"></button>
      </div>
    </div>
  </div>

  <!-- 5. Monitor live – recording (10671:25729) -->
  <div class="screen" id="screen-5" hidden>
    <div class="app">
      <img class="shot" src="assets/neuronaute/monitor-recording.png" alt="Monitor live – recording">
      <div class="ov" style="--w:1001">
        <div class="patch" aria-hidden="true" style="--img:url(assets/neuronaute/monitor-recording.png);--x:34;--y:53;--bw:236;--sy:82;--k:7.5"></div>
        <div class="ban" style="--x:38.1"><span class="badge"></span><span>Enregistrement 0986</span></div>
      </div>
    </div>
  </div>

  <img class="frame" src="assets/neuronaute/tablet-shape.png" alt="">
</div>
<script>
(function () {
  // Exam types (10697:46766), in the order of the Figma list; the last choice is "No Exam type" (no badge)
  var TYPES = [
    { name: 'ICU Monitoring', c: '#1628cf' },
    { name: 'Brain death', c: '#767684' },
    { name: 'VLD 72H', c: '#8152e6' },
    { name: 'Routine EEG', c: '#6fecb1', t: '#093409' },
    { name: 'No Exam type', none: true }
  ];
  var exam = 3;   // Routine EEG, as in the frames
  var ARROW = '<img class="arrow" src="assets/neuronaute/exam-arrow.svg" alt="">';
  function badge(t) {
    return t.none ? '<span class="no-type">' + t.name + '</span>'
                  : '<span class="badge" style="--c:' + t.c + (t.t ? ';--t:' + t.t : '') + '">' + t.name + '</span>';
  }

  // ---- screens ----
  var launch = document.getElementById('launch-nn');
  function show(n) {
    closeMenus(); if (typeof setInfo === 'function') setInfo(false);
    for (var i = 1; i <= 5; i++) document.getElementById('screen-' + i).hidden = i !== n;
    launch.hidden = n !== 1;
    render();
  }
  launch.addEventListener('click', function () { show(2); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go], [data-back]');
    if (b) show(+(b.dataset.go || b.dataset.back));
  });

  // ---- exam type: field + dropdown (screens 2 and 3), badge in the monitor banners (4 and 5) ----
  var cfgField = document.querySelector('.exam.cfg');
  function render() {
    document.querySelectorAll('.exam').forEach(function (f) { f.innerHTML = badge(TYPES[exam]) + ARROW; });
    // config screen without an exam type: empty-state frame, and no way forward until a type is chosen
    var none = !!TYPES[exam].none;
    document.getElementById('cfg-shot').src = 'assets/neuronaute/record-config' + (none ? '-empty' : '') + '.png';
    cfgField.classList.toggle('is-empty', none);
    if (none) cfgField.innerHTML = '<span class="ph">Select an exam type</span><img class="arrow" src="assets/neuronaute/exam-arrow-red.svg" alt="">';
    document.getElementById('cfg-menu').style.setProperty('--y', none ? 167 : 185);
    document.getElementById('cfg-save').disabled = none;
    document.querySelectorAll('.menu').forEach(function (m) {
      m.innerHTML = TYPES.map(function (t, i) {
        return '<li role="option" data-i="' + i + '" aria-selected="' + (i === exam) + '">' + badge(t) + '</li>';
      }).join('');
    });
    var cur = TYPES[exam];
    document.querySelectorAll('.ban .badge').forEach(function (b) {   // no badge in the banner without an exam type
      b.hidden = !!cur.none; if (cur.none) return;
      b.style.setProperty('--c', cur.c); b.style.setProperty('--t', cur.t || '#fff'); b.textContent = cur.name;
    });
  }
  function closeMenus() {
    document.querySelectorAll('.menu').forEach(function (m) { m.hidden = true; });
    document.querySelectorAll('.exam').forEach(function (f) { f.setAttribute('aria-expanded', 'false'); });
  }
  document.addEventListener('click', function (e) {
    var f = e.target.closest('.exam'), li = e.target.closest('.menu li');
    if (li) { exam = +li.dataset.i; closeMenus(); render(); return; }
    if (f) {
      var m = f.nextElementSibling, open = m.hidden;
      closeMenus();
      m.hidden = !open; f.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    if (!e.target.closest('.menu')) closeMenus();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeMenus(); setInfo(false); } });
  // Device info: a click on the icon shows / hides the popover above it; a click anywhere else hides it
  var dBtn = document.getElementById('dinfo-btn'), dBox = document.getElementById('dinfo');
  function setInfo(on) { dBox.hidden = !on; dBtn.setAttribute('aria-expanded', on ? 'true' : 'false'); }
  document.addEventListener('click', function (e) {
    if (e.target.closest('#dinfo-btn')) setInfo(dBox.hidden);
    else if (!e.target.closest('#dinfo')) setInfo(false);
  });
  render();
})();
</script>
</body>
</html>
